<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- Subtle grid lines for fiscal/data feel -->
  <line x1="64" y1="384" x2="448" y2="384" stroke="#1e40af" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="64" y1="320" x2="448" y2="320" stroke="#1e40af" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Bar chart accent (right side, subtle) -->
  <rect x="340" y="310" width="28" height="74" rx="6" fill="#f59e0b" fill-opacity="0.75"/>
  <rect x="378" y="280" width="28" height="104" rx="6" fill="#f59e0b" fill-opacity="0.5"/>
  <rect x="416" y="340" width="28" height="44" rx="6" fill="#f59e0b" fill-opacity="0.35"/>

  <!-- Letter G - main shape -->
  <text
    x="192"
    y="360"
    font-family="'Segoe UI', 'Arial', sans-serif"
    font-size="320"
    font-weight="700"
    fill="url(#gGrad)"
    letter-spacing="-10"
  >G</text>

  <!-- Amber accent underline -->
  <rect x="64" y="388" width="240" height="5" rx="2.5" fill="#f59e0b" fill-opacity="0.9"/>

  <!-- Top-right corner dot accent -->
  <circle cx="432" cy="92" r="14" fill="#06b6d4" fill-opacity="0.7"/>
</svg>
